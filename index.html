    <script>
      // Compatibility shim: provide a setter for window.fetch so browser extensions and tooling can safely wrap fetch without throwing "has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || originalFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
